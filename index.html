function parseNumber(raw) {
 let value = String(raw ?? '').trim().replace(/[\s\u00a0\u202f]/g, '').replace(/−/g, '-');
 if (value.includes(',')) value = value.replace(/\./g, '').replace(',', '.');
 if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(value)) return null;
 const n = Number(value);
 return Number.isFinite(n) ? n : null;
}

function getFields(task) { return task.steps.flatMap(step => step.fields); }

function readEntry(field, entry) {
 if (field.kind === 'choice') return entry?.raw || null;
 const n = parseNumber(entry?.raw);
 const units = unitGroups[field.kind];
 const index = Number(entry?.unit ?? 0);
 if (n === null || n <= 0 || !Number.isInteger(index) || !units?.[index]) return null;
 return n * units[index][1];
}

const roundSteps = {
 lengthSmall: [.001, .01, .1], length: [.1, 1, 10], area: [.001, .01, .1, 1],
 specific: [1, 10, 100, 1000], ratio: [.001, .01, .1], efficiency: [],
 force: [1, 10, 100, 1000], power: [.001, .01, .1, 1], speedSI: [.001, .01, .1, 1],
 speed: [.01, .1, 1, 10], feed: [.1, 1, 10], count: [.01, .1, 1], angle: [.1, 1, 10],
 rpm: [.1, 1, 10, 100], flow: [.01, .1, 1, 10, 100], volume: [.01, .1, 1, 10, 100]
};

function matchValue(field, actual, targets) {
 if (field.kind === 'choice') return targets.includes(actual) ? 'correct' : 'wrong';
 if (actual === null || !(actual > 0)) return 'invalid';
 for (const target of targets) {
  if (!(target > 0) || !Number.isFinite(target)) continue;
  if (Math.abs(actual - target) <= Math.max(1e-7, Math.abs(target) * (field.exact ? .00001 : .003))) return 'correct';
  if (field.exact) continue;
  if (field.readTolerance && Math.abs(actual - target) <= field.readTolerance) return 'rounded';
  for (const quantum of roundSteps[field.kind] || []) {
   const rounded = Math.round((target + Number.EPSILON) / quantum) * quantum;
   // Rounding may be coarse, but must produce an actual plausible rounded value.
   // Prevent tiny positive values from being accepted by rounding to zero.
   if (rounded > 0 && Math.abs(actual - rounded) <= Math.max(1e-7, quantum * .0001)) return 'rounded';
  }
 }
 return 'wrong';
}

function evaluate(task, entries = {}) {
 const fields = getFields(task), byId = new Map(fields.map(field => [field.id, field]));
 const canonical = {}, values = {}, results = {}, visiting = new Set();
 const reference = id => {
  if (id in canonical) return canonical[id];
  if (!byId.has(id)) throw new Error('Unknown field: ' + id);
  if (visiting.has(id)) throw new Error('Circular field dependency');
  visiting.add(id); canonical[id] = byId.get(id).expected(reference); visiting.delete(id);
  return canonical[id];
 };
 const compute = id => {
  if (results[id]) return results[id];
  const field = byId.get(id), entry = entries[id];
  const dependencies = [];
  const ownReference = field.expected(dep => {
   const previous = compute(dep);
   dependencies.push(previous);
   const typed = readEntry(byId.get(dep), entries[dep]);
   // Use students' actual intermediate values, including a wrong predecessor,
   // so correct subsequent arithmetic can be recognized without endorsing it.
   return typed === null ? reference(dep) : typed;
  });
  const actual = readEntry(field, entry);
  const targets = [ownReference, ...(field.alternatives || [])];
  let status = !entry?.raw?.trim() ? 'empty' : matchValue(field, actual, targets);
  const dependencyWrong = dependencies.some(r => ['wrong', 'invalid', 'followup'].includes(r.status));
  if (['correct', 'rounded'].includes(status) && dependencyWrong) status = 'followup';
  values[id] = ownReference;
  results[id] = { status, dependencyMissing: dependencies.some(r => r.status === 'empty') };
  return results[id];
 };
 fields.forEach(field => { reference(field.id); compute(field.id); });
 return results;
}

function taskProgress(task, entries = {}) {
 const results = evaluate(task, entries);
 const complete = task.steps.filter(step => step.fields.every(field => entries[field.id]?.checked === true && ['correct', 'rounded'].includes(results[field.id].status))).length;
 return { complete, total: task.steps.length, results };
}

function feedback(field, result) {
 const status = result.status;
 if (status === 'correct') return { tone: 'success', text: 'Richtig. Das passt.' };
 if (status === 'rounded') return { tone: 'success', text: 'Richtig. Das passt mit deiner Rundung.' };
 if (status === 'followup') return { tone: 'notice', text: 'Mit deinem Zwischenwert richtig gerechnet. Prüfe noch den vorherigen Schritt.' };
 if (status === 'empty') return { tone: 'neutral', text: 'Trage hier deinen eigenen Wert ein.' };
 if (status === 'invalid') return { tone: 'notice', text: 'Prüfe die Eingabe. Verwende eine positive Zahl und eine passende Einheit.' };
 if (field.kind === 'choice') return { tone: 'notice', text: 'Vergleiche deine beiden Rechenwege noch einmal.' };
 if (field.table) return { tone: 'notice', text: 'Schau im Tabellenbuch noch einmal nach. Prüfe Werkstoffzeile und Spaltenüberschrift.' };
 if (field.kind === 'efficiency') return { tone: 'notice', text: 'Prüfe den Wirkungsgrad und ob du Prozent oder eine Dezimalzahl ausgewählt hast.' };
 if (field.kind === 'power') return { tone: 'notice', text: 'Prüfe deinen Ansatz und die Leistungseinheit. Schau dir bei Bedarf den Hinweis zur Geschwindigkeit an.' };
 if (field.kind === 'speedSI' || field.kind === 'speed' || field.kind === 'feed') return { tone: 'notice', text: 'Prüfe die Einheiten und die verwendete Geschwindigkeit. Achte auf Minuten, Sekunden, Meter und Millimeter.' };
 if (['volume', 'flow'].includes(field.kind)) return { tone: 'notice', text: 'Prüfe die Volumen- und Zeiteinheiten sowie deinen vorherigen Zwischenwert.' };
 if (field.kind === 'count' || field.kind === 'angle') return { tone: 'notice', text: 'Schau dir Zeichnung und Eingriff noch einmal an. Prüfe auch deinen abgelesenen Winkel.' };
 return { tone: 'notice', text: result.dependencyMissing ? 'Prüfe deinen Ansatz und die Einheit. Falls du früh gerundet hast, trage auch deinen vorherigen Zwischenwert ein.' : 'Schau dir deinen Ansatz und die Einheit noch einmal an. Nutze bei Bedarf einen Hinweis.' };
}


// Native MathML keeps fractions and powers readable without an external library.
const escapeMath = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subDigits = '₀₁₂₃₄₅₆₇₈₉';
const normalizeSymbol = value => value.replace(/([A-Za-z])([₀-₉]+)/g, (_,base,digits) => base+'_'+[...digits].map(d => subDigits.indexOf(d)).join(''));
const mi = text => `<mi>${escapeMath(text)}</mi>`;
const mn = text => `<mn>${escapeMath(text)}</mn>`;
const mo = text => `<mo>${escapeMath(text)}</mo>`;
const row = (...parts) => `<mrow>${parts.join('')}</mrow>`;
const symbol = text => {
 const [base,index] = normalizeSymbol(text).split('_');
 return index === undefined ? mi(base) : `<msub>${mi(base)}<mtext>${escapeMath(index)}</mtext></msub>`;
};
const product = (...parts) => row(...parts.flatMap((part,index) => index ? [mo('·'),part] : [part]));
const fraction = (top,bottom) => `<mfrac>${top}${bottom}</mfrac>`;
const power = (base,exponent) => `<msup>${base}${exponent}</msup>`;
const sum = (...parts) => row(...parts.flatMap((part,index) => index ? [mo('+'),part] : [part]));
const sine = (argument,parentheses = false) => row('<mi mathvariant="normal">sin</mi><mspace width="0.16em"/>',...(parentheses ? [mo('('),argument,mo(')')] : [argument]));
const equation = (lhs,rhs,operator = '=') => row(symbol(lhs),mo(operator),rhs);
const key = text => text.replace(/\s/g,'');
const definitions = new Map();
const define = (source,label,rhs,lhs = source.split(/[=≈]/)[0].trim(),operator = '=') => definitions.set(key(source),{label,markup:equation(lhs,rhs,operator)});

function mathML(markup,display = 'inline') {
 return `<math xmlns="http://www.w3.org/1998/Math/MathML" display="${display}">${markup}</math>`;
}

function formatInlineText(text) {
 // Only replace symbolic tokens; prose and given values stay escaped plain text.
 const tokens = /[A-Za-z]_[A-Za-z0-9]+(?:[.,][A-Za-z0-9]+)*|[A-Za-z][₀-₉]+/g;
 let html = '', end = 0;
 for (const match of String(text).matchAll(tokens)) {
  html += escapeMath(String(text).slice(end,match.index));
  html += mathML(symbol(match[0])); end = match.index+match[0].length;
 }
 return html+escapeMath(String(text).slice(end));
}

function formulaLines(source) {
 return String(source).trim().split(/\s{2,}|\n+/).filter(Boolean);
}

function hasFormulaDefinition(source) { return definitions.has(key(source)); }

function renderFormulaStack(source) {
 return `<div class="formula-stack">${formulaLines(source).map(line => {
  const item = definitions.get(key(line));
  if (!item) return `<div class="formula-equation"><div class="equation-math">${formatInlineText(line)}</div></div>`;
  return `<div class="formula-equation"><span class="equation-label">${escapeMath(item.label)}</span><div class="equation-math">${mathML(item.markup,'block')}</div></div>`;
 }).join('')}</div>`;

function entries(task) {

function route() {
 const parts = location.hash.replace(/^#\/?/, '').split('/');

function resultHTML(field, result) {
 const msg = feedback(field, result);
 return `<div class="field-result ${msg.tone}" id="result-${field.id}"><span class="result-icon" aria-hidden="true">${msg.tone === 'success' ? '✓' : msg.tone === 'notice' ? '↻' : '·'}</span><span>${esc(msg.text)}</span></div>`;
}
function fieldHTML(task, field, results) {
 const entry = entries(task)[field.id] || {}, result = results[field.id];
 const show = entry.checked === true;
 const msg = show ? feedback(field, result) : null;
 const resultClass = show ? ' is-' + msg.tone : '';
 let control;
 if (field.kind === 'choice') control = `<select class="choice-select" id="input-${field.id}" name="${field.id}" data-field="${field.id}" aria-describedby="${show ? 'result-'+field.id : 'form-note'}"><option value="">Deine Einschätzung wählen</option>${field.options.map(([v,label]) => `<option value="${esc(v)}" ${entry.raw === v ? 'selected':''}>${esc(label)}</option>`).join('')}</select>`;
 else control = `<div class="input-group"><input class="value-input" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" id="input-${field.id}" name="${field.id}" data-field="${field.id}" value="${esc(entry.raw)}" placeholder="Dein Wert" aria-describedby="${show ? 'result-'+field.id : 'form-note'}" ${show && ['wrong','invalid'].includes(result.status) ? 'aria-invalid="true"':''}><select class="unit-select" aria-label="Einheit für ${esc(field.label)}" data-unit="${field.id}">${unitGroups[field.kind].map(([label],i) => `<option value="${i}" ${Number(entry.unit || 0) === i ? 'selected':''}>${esc(label)}</option>`).join('')}</select></div>`;
 return `<div class="field-row${resultClass}" data-row="${field.id}"><div class="field-label"><label for="input-${field.id}">${esc(field.label)}</label><span class="field-symbol" aria-hidden="true">${math(field.symbol)}</span></div>${control}${show ? resultHTML(field, result) : ''}</div>`;
}
function hintsHTML(task, step) {

 return `<div class="side-heading">${bulb}Ein Gedanke zum Weiterkommen</div>${level === 0 ? '<p class="hint-intro">Du steckst fest? Öffne einen kleinen Hinweis. Wenn du mehr brauchst, gehst du einen Schritt weiter.</p>' : ''}<div class="hint-items" aria-live="polite">${step.hints.slice(0,level).map((h,i) => `<section class="hint-item"><span class="hint-step">Tipp ${i+1} von 3</span><h3>${esc(h.title)}</h3><p>${math(h.text)}</p>${h.formula ? renderFormulaStack(h.formula):''}</section>`).join('')}</div>${level < 3 ? `<button class="button button-secondary hint-button" type="button" id="hint-button">${level === 0 ? 'Ich brauche einen Tipp' : 'Noch einen Hinweis'} ${arrow}</button>` : '<p class="teacher-note">Du kommst noch nicht weiter? Zeig deiner Lehrkraft deinen bisherigen Rechenweg.</p>'}<p class="student-note">Rechne auf deinem Blatt weiter. Du entscheidest, wie viel Hilfe du brauchst.</p>`;
}
function sidebarHTML(task) {
 return `<aside class="work-sidebar" aria-label="Aufgabenübersicht"><a class="back-link" href="#"><span aria-hidden="true">←</span> Alle Aufgaben</a>${['schnitt','volumen'].map(sheet => `<div class="sidebar-label eyebrow">${sheet === 'schnitt' ? 'SCHNITTBERECHNUNGEN' : 'ZEITSPANUNGSVOLUMEN'}</div>${tasks.filter(t => t.sheet === sheet).map(t => {

  return `<a class="sidebar-task ${t.id === task.id ? 'active':''}" href="${taskHref(t)}" ${t.id === task.id ? 'aria-current="page"':''}><span class="sidebar-num">${t.number}</span><span><strong>${t.title}</strong><small>${t.material}</small></span>${p.complete === p.total ? '<span class="sidebar-check" aria-label="abgeschlossen">✓</span>':''}</a>`;
 }).join('')}`).join('')}<div class="sidebar-note">${book}Leg dein Übungsblatt, dein Tabellenbuch und den Taschenrechner bereit.</div></aside>`;

function renderWork(task, index) {

 state.last = taskHref(task, index);
 $('#main').innerHTML = `<div class="work-layout">${sidebarHTML(task)}<div class="work-main"><a class="back-link mobile-back" href="#">← Alle Aufgaben</a><div class="work-top"><div><div class="work-kicker">${task.sheet === 'schnitt' ? 'SCHNITTBERECHNUNGEN' : 'ZEITSPANUNGSVOLUMEN'} <span aria-hidden="true"> / </span> ${task.label.toUpperCase()}</div><h1>${task.title}</h1><p class="work-subtitle">${task.subtitle} · ${task.material}</p></div><div class="work-progress"><strong id="progress-count">${p.complete}<span aria-hidden="true"> / </span>${p.total}</strong><small>Schritte geprüft</small><div class="progress-line" role="progressbar" aria-label="Geprüfte Schritte dieser Aufgabe" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.complete}"><span style="width:${p.complete/p.total*100}%"></span></div></div></div>

   <section class="step-panel" aria-labelledby="step-title"><div class="step-head"><div class="eyebrow">TEILAUFGABE ${esc(step.id[0].toUpperCase())} <span aria-hidden="true"> · </span> DEIN RECHENWEG</div><h2 id="step-title">${esc(step.title)}</h2><p>${esc(step.description)}</p></div><div class="step-columns"><aside class="hint-side" id="hint-panel" aria-label="Hinweise">${hintsHTML(task,step)}</aside><div class="check-side"><div class="side-heading">${checkIcon}Deine Eingaben prüfen</div><form id="check-form" novalidate>${step.fields.map(field => fieldHTML(task,field,p.results)).join('')}<button type="submit" class="button button-primary check-button">Eingaben prüfen ${checkIcon}</button><p class="form-help" id="form-note">Komma oder Punkt für Dezimalstellen.<br>Tausender kannst du mit einem Leerzeichen trennen.</p><div class="form-summary" id="form-summary" role="status" hidden></div></form></div></div></section>

function updateProgress(task) {
 const p = taskProgress(task, entries(task));
 $('#progress-count').innerHTML = `${p.complete}<span aria-hidden="true"> / </span>${p.total}`;
 const bar = $('.progress-line'); bar.setAttribute('aria-valuenow',p.complete); bar.firstElementChild.style.width = p.complete/p.total*100+'%';
 task.steps.forEach(step => {
  const node = document.querySelector('[data-step="'+step.id+'"]'), done = stepDone(task,step,p.results);
  node.classList.toggle('done', done); node.querySelector('.done-mark').textContent = done ? '✓':'';
 });
 $('#completion-note').hidden = p.complete !== p.total;
 return p;
}
function handleEdit(event) {
 const control = event.target, id = control.dataset.field || control.dataset.unit;
 if (!id) return;
 const { task, index } = route(); if (!task) return;
 const data = entries(task), step = task.steps[index];
 data[id] ||= { raw:'', unit:0 };
 if (control.dataset.unit) data[id].unit = Number(control.value); else data[id].raw = control.value;
 step.fields.forEach(field => { if (data[field.id]) data[field.id].checked = false; });
 step.fields.forEach(field => {
  const row = document.querySelector('[data-row="'+field.id+'"]');
  row.classList.remove('is-success','is-notice','is-neutral'); row.querySelector('.field-result')?.remove();
  const input = $('#input-'+field.id); input.removeAttribute('aria-invalid'); input.setAttribute('aria-describedby','form-note');

function openInfo(kind) {
 const dialog = $('#info-dialog'), content = $('#dialog-content');

  content.innerHTML = '<h2 id="dialog-title">Dein Arbeitsstand bleibt hier.</h2><p>Der Rechenlotse speichert deine Eingaben, geöffneten Hinweise und Fortschritte im Browser auf diesem Gerät. Du brauchst keinen Namen und keine Anmeldung.</p><p>Die Anwendung überträgt deine Eingaben nicht an eine Lehrkraft oder einen anderen Dienst. Auf einem gemeinsam genutzten Gerät kannst du deinen Arbeitsstand über „Neu beginnen“ löschen.</p><p>Wenn dein Browser die lokale Speicherung nicht erlaubt, kannst du trotzdem üben. Beim Schließen kann der Arbeitsstand dann verloren gehen.</p><div class="dialog-actions"><button type="button" class="button button-primary" data-close>Verstanden</button></div>';
 } else {
  content.innerHTML = '<h2 id="dialog-title">Dein nächster Schritt zählt.</h2><p>Du rechnest auf deinem Übungsblatt. Der Lotse hilft dir, wenn du einen Gedanken zum Weiterkommen brauchst.</p><ol class="how-list"><li><div><strong>Wähle deine Aufgabe.</strong>Die Nummern passen zu deinem Übungsblatt. Du kannst direkt zu einer Teilaufgabe springen.</div></li><li><div><strong>Rechne und schlage nach.</strong>Nutze Tabellenbuch und Taschenrechner. Öffne bei Bedarf einen Hinweis nach dem anderen.</div></li><li><div><strong>Prüfe deine Eingabe.</strong>Trage deinen Wert mit Einheit ein. Du bekommst eine Rückmeldung und bei Bedarf einen Prüfhinweis. Auch gerundete Zwischenwerte werden berücksichtigt.</div></li></ol><p>Wenn du früh gerundet hast, trage deine Zwischenwerte in den vorherigen Schritten ein. So kann der Lotse deinen Rechenweg berücksichtigen.</p><div class="dialog-actions"><button type="button" class="button button-primary" data-close>Los geht’s '+arrow+'</button></div>';
 }
 dialog.showModal();
}

document.addEventListener('input', handleEdit);
document.addEventListener('change', event => { if (event.target.matches('select')) handleEdit(event); });
document.addEventListener('submit', event => {

 step.fields.forEach(field => { data[field.id] ||= { raw:'', unit:0 }; data[field.id].checked = true; });

 step.fields.forEach(field => {

  const input = $('#input-'+field.id); input.setAttribute('aria-describedby','result-'+field.id);

 });

 summary.hidden = false; summary.classList.toggle('notice',!good);
 summary.textContent = good ? 'Das passt. Du kannst auf deinem Blatt weiterarbeiten.' : 'Schau dir die Hinweise bei deinen Eingaben an. Du kannst deinen Rechenweg jederzeit erneut prüfen.';
 updateProgress(task); persist();
});
document.addEventListener('click', event => {

 if (target.dataset.filter) { state.filter = target.dataset.filter; const top = window.scrollY; renderHome(); window.scrollTo(0,top); document.querySelector('[data-filter="'+state.filter+'"]').focus({ preventScroll:true }); }

  const {task,index} = route(); const step = task.steps[index], key = task.id+':'+step.id;
  state.hints[key] = Math.min(3, (Number(state.hints[key]) || 0)+1); $('#hint-panel').innerHTML = hintsHTML(task,step); persist();
 }
 if (target.dataset.info || target.id === 'help-button') openInfo('how');
 if (target.id === 'privacy-button') openInfo('privacy');

 }
});
$('#info-dialog').addEventListener('click', event => { if (event.target === event.currentTarget) { const rect = event.currentTarget.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) event.currentTarget.close(); } });
function render() {

 if (task) { document.title = task.label+' · '+task.title+' | Rechenlotse'; renderWork(task,index); persist(); }
 else { document.title = 'Rechenlotse · Dein Übungsbegleiter'; renderHome(); }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); $('#main').focus({ preventScroll:true }); });
render();
if (Object.keys(state.entries).length && storageAvailable) $('#save-status').innerHTML = '<span></span>Auf diesem Gerät gespeichert';
